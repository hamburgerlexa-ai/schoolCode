{% extends "base.html" %}

{% block title %}Регистрация - School Coding Platform{% endblock %}

{% block content_guest %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div class="card" style="width: 100%; max-width: 480px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; color: white;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Создать аккаунт</h1>
            <p style="color: var(--text-muted);">Присоединяйтесь к платформе</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="grid grid-cols-2 gap-2">
                <div class="form-group">
                    <label class="form-label" for="first_name">Имя</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Имя">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="last_name">Фамилия</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Фамилия">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="username">Имя пользователя *</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Придумайте имя пользователя" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Пароль *</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm_password">Подтвердите пароль *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Повторите пароль" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="role">Тип аккаунта</label>
                <select id="role" name="role" class="form-control">
                    <option value="student">Ученик</option>
                    <option value="teacher">Учитель</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary w-full" style="margin-bottom: 16px;">
                <i class="fas fa-user-plus"></i>
                Зарегистрироваться
            </button>
        </form>
        
        <div style="text-align: center; padding-top: 16px; border-top: 1px solid var(--border-color);">
            <p style="font-size: 14px; color: var(--text-muted);">
                Уже есть аккаунт?
                <a href="{{ url_for('login') }}" style="color: var(--accent-primary); font-weight: 500;">Войти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
